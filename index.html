<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Backgammon</title>
  </head>
  <body>
    <h1>Backgammon</h1>
    <div class="backgammon-game" id="backgammonGame">
      <div class="piece-containers" id="pieceContainers">
        <div class="board-side">
          <div class="row">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
          </div>
          <div class="dice-container">
            <button class="roll-btn white-btn" id="whiteRollBtn">Roll!</button>
            <div class="dices hide">
              <div class="dice"><i class="fa-solid fa-dice-six"></i></div>
              <div class="dice"><i class="fa-solid fa-dice-five"></i></div>
            </div>
          </div>
          <div class="row">
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
          </div>
        </div>
        <div class="middle-piece"></div>
        <div class="board-side">
          <div class="row">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
          </div>
          <div class="dice-container">
            <button class="roll-btn black-btn" id="blackRollBtn">Roll!</button>
            <div class="dices hide">
              <div class="dice black-dice">seees1</div>
              <div class="dice black-dice">seees2</div>
            </div>
          </div>
          <div class="row">
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
            <div class="slot bottom"></div>
          </div>
        </div>
      </div>

      <div class="board">
        <div class="board-side">
          <div class="row top">
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
          </div>
          <div class="row bottom">
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
          </div>
        </div>
        <div class="middle-piece"></div>
        <div class="board-side">
          <div class="row top">
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
          </div>
          <div class="row bottom">
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
            <div class="slot"><div class="triangle"></div></div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
